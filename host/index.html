<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBQ — Host</title>
    <script>
      let hostAccessGranted = false;

      try {
        hostAccessGranted =
          sessionStorage.getItem("bbq.hostAccess") === "granted";
      } catch {
        hostAccessGranted = false;
      }

      if (!hostAccessGranted) {
        window.location.replace("/bbq/");
      }
    </script>
  </head>
  <body>
    <main>
      <section class="stack">
        <p class="eyebrow">Current cue</p>
        <h1 id="cue">Welcome</h1>
        <p id="phase" aria-live="polite">Lobby</p>
      </section>

      <section class="stack" aria-labelledby="players-heading">
        <h2 id="players-heading">Players</h2>
        <p id="empty-state">Waiting for players...</p>
        <ol id="players" hidden></ol>
      </section>

      <section id="host-game" class="host-game stack" hidden>
        <img id="host-game-image" class="game-image host-game-image" alt="" />
        <h2 id="host-question"></h2>
        <p><strong>Correct answer:</strong> <span id="correct-answer"></span></p>
        <p id="notes" class="host-notes"></p>
      </section>

      <section class="stack">
        <h2 id="submissions-heading" hidden>Submissions</h2>
        <p id="empty-submissions" hidden>No answers submitted yet.</p>
        <ol id="submissions" class="submissions" hidden></ol>
        <div id="bulk-actions" class="bulk-actions" hidden>
          <button id="mark-all-correct" class="secondary" type="button">
            MARK ALL REMAINING CORRECT
          </button>
          <button id="mark-all-incorrect" class="secondary" type="button">
            MARK ALL REMAINING INCORRECT
          </button>
        </div>
      </section>

      <div class="actions">
        <button id="reset-game" class="danger secondary" type="button">
          RESET GAME
        </button>
        <button id="next" type="button">NEXT</button>
      </div>
      <p id="action-status" class="status" role="status" aria-live="polite"></p>
    </main>
    <dialog id="reset-dialog">
      <section class="stack">
        <h2>Reset the entire game?</h2>
        <p>
          This removes every player and all game data. Everyone will need to
          join again.
        </p>
        <button id="reset-confirm" class="danger" type="button">
          RESET GAME
        </button>
        <button id="reset-cancel" class="secondary" type="button">CANCEL</button>
      </section>
    </dialog>
    <script type="module" src="./main.js"></script>
  </body>
</html>
