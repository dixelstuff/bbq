<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBQ — Display</title>
  </head>
  <body>
    <main class="display">
      <section id="waiting-screen" class="waiting-screen">
        <canvas id="join-qr" aria-label="QR code for the player website"></canvas>
        <p id="waiting-player-count" class="waiting-player-count">0 PLAYERS</p>
        <ul id="player-names" class="player-names"></ul>
      </section>

      <section id="question-screen" class="display-game-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <p id="display-round-type" class="display-round-type"></p>
        <img id="display-question-image" class="display-game-image" alt="" />
        <h1 id="display-question"></h1>
        <p id="display-prompt" class="display-prompt"></p>
      </section>

      <section id="holding-screen" class="display-center-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <h1 id="holding-text">ANSWERS LOCKED</h1>
      </section>

      <section id="pairing-screen" class="pairing-screen" hidden>
        <img id="pairing-title-image" class="pairing-title-image" alt="" />
        <div class="now-playing">
          <p>NOW PLAYING</p>
          <h1 id="active-pair-names">WAITING FOR PAIRS</h1>
        </div>
      </section>

      <section id="groups-screen" class="groups-screen" hidden>
        <p id="groups-mode-title">GROUPS</p>
        <div id="display-groups" class="display-groups"></div>
      </section>

      <section id="reveal-screen" class="display-results-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <p id="reveal-round-type" class="display-round-type"></p>
        <h1 id="reveal-question"></h1>
        <p id="reveal-correct-answer" class="reveal-correct-answer"></p>
        <ol id="reveal-answers" class="reveal-answers"></ol>
      </section>

      <section id="leaderboard-screen" class="display-results-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <h1>LEADERBOARD</h1>
        <ol id="leaderboard" class="leaderboard"></ol>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
