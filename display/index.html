<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBQ — Display</title>
  </head>
  <body>
    <main class="display">
      <section id="waiting-screen" class="waiting-screen">
        <canvas id="join-qr" aria-label="QR code for the player website"></canvas>
        <p id="waiting-player-count" class="waiting-player-count">0 PLAYERS</p>
        <ol id="player-names" class="player-names"></ol>
      </section>

      <section id="question-screen" class="display-game-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <img id="display-question-image" class="display-game-image" alt="" />
        <h1 id="display-question"></h1>
      </section>

      <section id="holding-screen" class="display-center-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <h1 id="holding-text">ANSWERS LOCKED</h1>
      </section>

      <section id="reveal-screen" class="display-results-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <h1 id="reveal-question"></h1>
        <ol id="reveal-answers" class="reveal-answers"></ol>
      </section>

      <section id="leaderboard-screen" class="display-results-screen" hidden>
        <p class="corner-player-count">0 players</p>
        <h1>LEADERBOARD</h1>
        <ol id="leaderboard" class="leaderboard"></ol>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
