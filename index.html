<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBQ — Player</title>
  </head>
  <body>
    <main>
      <div id="player-badge" class="player-badge" hidden></div>
      <form id="join-form" class="stack">
        <label for="name"><h1>Enter your name</h1></label>
        <input
          id="name"
          name="name"
          type="text"
          maxlength="40"
          autocomplete="name"
          autocapitalize="characters"
          required
        />
        <button type="submit">JOIN</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
      <section id="waiting-view" class="player-waiting" hidden>
        <div class="bbq-wordmark" aria-label="BBQ">BBQ</div>
        <h1 id="waiting-message">Waiting for next round…</h1>
      </section>
      <section id="question-view" class="player-question stack" hidden>
        <img id="question-media" class="game-image" alt="" hidden />
        <p id="player-round-type" class="eyebrow"></p>
        <h1 id="question-text"></h1>
        <form id="answer-form" class="stack">
          <div id="answer-text-control" class="stack">
            <label for="answer">Your answer</label>
            <p id="answer-instruction" class="answer-instruction"></p>
            <input id="answer" name="answer" maxlength="240" autocomplete="off" />
          </div>
          <div id="lyrics-answer-fields" class="lyrics-answer-fields stack" hidden>
            <label for="lyrics-next-line">Next line</label>
            <input id="lyrics-next-line" maxlength="240" autocomplete="off" />
            <label for="lyrics-song-title">Song title</label>
            <input id="lyrics-song-title" maxlength="120" autocomplete="off" />
            <label for="lyrics-artist">Artist</label>
            <input id="lyrics-artist" maxlength="120" autocomplete="off" />
          </div>
          <div id="choice-options" class="choice-options"></div>
          <button id="answer-submit" type="submit">SUBMIT</button>
          <p id="answer-status" class="status" role="status"></p>
        </form>
      </section>
      <section id="voting-view" class="player-question stack" hidden>
        <p class="eyebrow">MY DEFINITION</p>
        <h1>Which definition is real?</h1>
        <div id="definition-options" class="definition-options"></div>
        <p id="vote-status" class="status" role="status"></p>
      </section>
      <section id="pair-view" class="pair-view stack" hidden>
        <p id="pair-status" class="eyebrow">YOUR GROUP</p>
        <h1 id="pair-members"></h1>
        <p id="pair-waiting">Waiting for your turn…</p>
      </section>
      <p id="player-result" class="player-result" hidden></p>
      <section id="recovery-panel" class="recovery-panel" hidden>
        <h2>STILL DISCONNECTED</h2>
        <button id="refresh-player" type="button">REFRESH TO RECONNECT</button>
      </section>
      <aside id="debug-panel" class="debug-panel" hidden>
        <strong>Development</strong>
        <span>Status: <b id="debug-connection">Disconnected</b></span>
        <span>Player: <b id="debug-name">Not joined</b></span>
        <span>Screen: <b id="debug-screen">1</b></span>
        <span>Last attempt: <b id="debug-reconnect">Never</b></span>
      </aside>
    </main>
    <script type="module" src="./player/main.js"></script>
  </body>
</html>
